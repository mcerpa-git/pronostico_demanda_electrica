prepare:
  dias_entrenamiento: 88
  horas_prueba: 48

model:
  tipo_modelo: autoarima
  order: [1, 1, 1]
  seasonal_order: [1, 1, 0, 24]
  usar_exogena: yes
  autoarima:
    start_p: 0
    max_p: 3
    start_q: 0
    max_q: 3
    d: null
    max_d: 2
    start_P: 0
    max_P: 2
    start_Q: 0
    max_Q: 2
    D: null
    max_D: 1
    seasonal: true
    m: 24
    stepwise: true
    with_intercept: false

mlflow:
  run_name: autoarima-con-exogena
  tracking_uri: sqlite:///mlflow.db
  experiment_name: pronostico-demanda-electrica
  fuente: xm-open-meteo-dvc
  dataset_name: xm_demanda_horaria

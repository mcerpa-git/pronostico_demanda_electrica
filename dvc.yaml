stages:
  prepare:
    cmd: .venv/bin/python -m codigo.prepare
    deps:
      - datos/xm_demanda.csv
      - codigo/prepare.py
    params:
      - prepare.dias_entrenamiento
      - prepare.horas_prueba
    outs:
      - datos/train.csv
      - datos/test.csv

  train:
    cmd: .venv/bin/python -m codigo.train
    deps:
      - datos/train.csv
      - datos/test.csv
      - codigo/train.py
    params:
      - model.tipo_modelo
      - model.order
      - model.seasonal_order
      - model.usar_exogena
      - model.autoarima
      - mlflow.tracking_uri
      - mlflow.experiment_name
      - mlflow.run_name
      - mlflow.fuente
      - mlflow.dataset_name
    metrics:
      - metrics.json:
          cache: false
